[xml]
# Namespace principal do XML nacional da NFS-e.
nfse_ns = http://www.sped.fazenda.gov.br/nfse

# Namespace padrao de assinatura digital XML.
xmldsig_ns = http://www.w3.org/2000/09/xmldsig#

[ambiente_1]
# Ambiente de producao da SEFIN Nacional.
nome = producao

# URL base usada para transmitir a DPS em producao.
sefin_base_url = https://sefin.nfse.gov.br/SefinNacional

[ambiente_2]
# Ambiente de homologacao/producao restrita da SEFIN Nacional.
nome = homologacao

# URL base usada para transmitir a DPS em homologacao.
sefin_base_url = https://sefin.producaorestrita.nfse.gov.br/SefinNacional
