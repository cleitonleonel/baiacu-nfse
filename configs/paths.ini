[schemas]
# Diretório onde ficam os arquivos XSD oficiais usados para validar a DPS.
# Pode ser relativo a raiz do projeto NFSe ou absoluto.
dir = configs/schemas
versao = 1.01
ful_dir = dir/versao

# Arquivo XSD de onde o nucleo le a ordem oficial das tags XML.
# Esse arquivo contem os xs:sequence dos tipos complexos da DPS.
schema_organizacao_xml = ful_dir/tiposComplexos_v1.01.xsd

# Arquivo XSD principal usado para validar a DPS montada.
# Esse XSD importa/inclui os demais schemas necessários da mesma pasta.
schema_validacao_xml = ful_dir/DPS_v1.01.xsd

# ---------------------------------------------------------------------------------------------
# NT 009 release 1: XSD OFICIAL PRODREST publicado em 20/10/2026.
# Fonte: https://www.gov.br/nfse/pt-br/biblioteca/documentacao-tecnica/producao-restrita
# Homologacao usa este release para TODAS as notas; producao mantem o leiaute atual.
# O comunicado de 20/10 preve producao em 01/12/2026; nao liberar por data automaticamente.
# Comunicado de 29/10: releases 1 a 3 previstos em producao em 01/12/2026. Os releases 2 e 3 ainda
# nao tinham XSD em 13/11 (o 2 move indDest/dest para infDPS). Antes de usar "ambos", conferir
# qual XSD a SEFIN implantou em producao e atualizar versao_nt009. Ver o relatorio SEFIN_20261113.md (fora do codigo, em extras/relatorios).
versao_nt009 = 1.01-nt009-r1-20261020
nt009_aceito_em = homologacao

# Especificacao completa posterior ao release 1 (provisoria, derivada da planilha).
# Preservada somente para pre-visualizacao de condominio, ainda sem transmissao.
versao_nt009_futuro = 1.01-nt009
