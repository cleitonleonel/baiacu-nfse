[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"

[lib]
name = "nucleo"
crate-type = ["lib", "cdylib"]

[workspace]
members = ["atualizador"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dependencies]
baiacu-atualizador = { path = "atualizador" }
aes-gcm = "0.11.1"
base64 = "0.23.1"
calamine = { version = "0.38.0", default-features = false, features = ["chrono"] }
chrono = "0.4.45"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
html-escape = "0.2.15"
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
lettre = "0.11.24"
openssl = "0.10"
p12-keystore = "0.4.0"
pbkdf2 = "0.13.0"
phonenumber = "0.3.10"
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
roxmltree = "0.21.1"
rsa = { version = "0.9.10", features = ["sha2"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher", "backup"] }
rust_decimal = "1.43.0"
rust_xlsxwriter = { version = "0.100.0", default-features = false }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "cookies", "win-system-proxy"] }
webpki-root-certs = "1.0.10"
x509-parser = "0.18.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
